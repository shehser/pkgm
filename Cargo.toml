[package]
name = "pkgm"
version = "0.0.1"
edition = "2021"
license = "GPL-3.0-or-later"

[[bin]]
name = "pkgm"
path = "src/main.rs"

[dependencies]
flate2 = "1.0"
tar = "0.4"
users = "0.11"
libc = "0.2"
regex = "1.10"
clap = { version = "4.4", features = ["derive"] }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
