[package]
name = "pkgm"
version = "0.2.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
clap = { version = "4.0", features = ["derive"] }
env_logger = "0.11.11"
flate2 = "1.0"
fs2 = "0.4"
libc = "0.2"
log = "0.4"
regex = "1.0"
reqwest = { version = "0.13.4", features = ["blocking", "json"] }
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha256 = "1.0"
tar = "0.4"
tempfile = "3.0"
toml = "1.1.4"
users = "0.11"
