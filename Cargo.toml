[package]
name = "pkgm"
edition = "2021"

[dependencies]
anyhow = "1.0"
clap = { version = "4.0", features = ["derive"] }
flate2 = "1.0"
fs2 = "0.4"
libc = "0.2"
log = "0.4"
env_logger = "0.10"
regex = "1.0"
reqwest = { version = "0.11", features = ["blocking", "json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha256 = "1.0"
tar = "0.4"
tempfile = "3.0"
toml = "0.8"
users = "0.11"
